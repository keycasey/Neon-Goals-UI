name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.repository == 'keycasey/Neon-Goals-UI'
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          export PATH=/home/ec2-user/.bun/bin:$PATH
          cd /var/www/Neon-Goals-UI
          git fetch origin main

          deploy_src="$(mktemp -d /tmp/neon-goals-ui-deploy.XXXXXX)"
          cleanup() {
            rm -rf -- "$deploy_src"
          }
          trap cleanup EXIT

          git archive origin/main | tar -x -C "$deploy_src"
          cd "$deploy_src"
          bun install --frozen-lockfile
          bun run build
          rsync -a --delete dist/ /var/www/Neon-Goals-UI/dist/

          verify_json_field() {
            local url=$1
            local field=$2
            local expected=$3
            curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 "$url" |
              bun -e '
                const [field, expected] = process.argv.slice(1);
                const document = await Bun.stdin.json();
                if (document[field] !== expected) {
                  throw new Error(`Expected ${field}=${expected}, received ${JSON.stringify(document[field])}`);
                }
              ' "$field" "$expected"
          }

          verify_json_field \
            https://goals.keycasey.com/.well-known/oauth-authorization-server/api \
            issuer \
            https://goals.keycasey.com/api
          verify_json_field \
            https://goals.keycasey.com/.well-known/openid-configuration/api \
            issuer \
            https://goals.keycasey.com/api
          verify_json_field \
            https://goals.keycasey.com/.well-known/oauth-protected-resource/api/mcp \
            resource \
            https://goals.keycasey.com/api/mcp
