name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.repository == 'keycasey/Neon-Goals-UI'
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          export PATH=/home/ec2-user/.bun/bin:$PATH
          cd /var/www/Neon-Goals-UI
          git fetch origin main

          deploy_src="$(mktemp -d /tmp/neon-goals-ui-deploy.XXXXXX)"
          cleanup() {
            rm -rf -- "$deploy_src"
          }
          trap cleanup EXIT

          git archive origin/main | tar -x -C "$deploy_src"
          cd "$deploy_src"
          bun install --frozen-lockfile
          bun run build
          rsync -a --delete dist/ /var/www/Neon-Goals-UI/dist/
